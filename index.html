<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('toniclite_theme') || localStorage.getItem('opentensor_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }

          var savedZoom = localStorage.getItem('toniclite_zoom') || '0.9';
          document.documentElement.style.zoom = savedZoom;
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.zoom = '0.9';
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/images/logos/toniclite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TonicLite - Master Machine Learning & AI From Scratch</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css" integrity="sha384-zh0CIslj+VczCZtlzBcjt5ppRNeUiNwtxnogHnnQQmULY93dUcvn9iFhpNyVUXlK" crossorigin="anonymous">
    <!-- TensorTonic ML Math Styles & Module Bundle -->
    <link rel="stylesheet" href="/katex.css" />
    <link rel="stylesheet" href="/tensortonic.css" />
    <script defer src="/tt-modules-bundle.js"></script>
    <!-- Pyodide for In-Browser Python & NumPy Execution -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  </head>
  <body class="h-full w-full bg-background text-foreground antialiased selection:bg-brand-accent/20 selection:text-brand-accent overflow-hidden">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
